[lightning]
task-info-schema-name = 'lightning_task_info'

[tikv-importer]
backend = 'local'
add-index-by-sql = true

[conflict]
strategy = "error"

[checkpoint]
enable = true

[mydumper]
batch-size = 2
# ensure each file is its own engine to facilitate cross-engine detection.

[mydumper.csv]
header = false
